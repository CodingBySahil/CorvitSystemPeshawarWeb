<!-- 
    Assignment 5: Basic HTML Form
    Objective:
    - Students will learn how to create a simple form using HTML.
    - Includes labels, input fields, radio buttons, checkboxes, textarea, and submit button.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form Assignment</title>
</head>

<body>

    <h1>Student Registration Form</h1>
    <p>Fill this basic form to practice HTML form elements.</p>

    <!-- FORM START -->
    <form>

        <!-- Text Input -->
        <label>Full Name:</label>
        <input type="text" placeholder="Enter your full name">
        <br><br>

        <!-- Email Input -->
        <label>Email:</label>
        <input type="email" placeholder="Enter your email">
        <br><br>

        <!-- Number Input -->
        <label>Age:</label>
        <input type="number" placeholder="Enter your age">
        <br><br>

        <!-- Radio Buttons -->
        <label>Gender:</label><br>
        <input type="radio" name="gender"> Male <br>
        <input type="radio" name="gender"> Female <br><br>

        <!-- Checkbox -->
        <label>Select Your Skills:</label><br>
        <input type="checkbox"> HTML <br>
        <input type="checkbox"> CSS <br>
        <input type="checkbox"> JavaScript <br><br>

        <!-- Textarea -->
        <label>Short Bio:</label><br>
        <textarea rows="4" cols="30" placeholder="Write about yourself"></textarea>
        <br><br>

        <!-- Submit Button -->
        <button type="submit">Submit Form</button>

    </form>
    <!-- FORM END -->

</body>

</html>
