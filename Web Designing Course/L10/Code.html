<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Flex Navbar</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2,red, yellow,green);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
        }

        /* NAVBAR CONTAINER */
        .flex-container {
            width: 90%;
            max-width: 1200px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        /* SEARCH */
        .search-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            padding: 10px 14px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
            width: 180px;
        }

        .search-box label {
            background: #ff6b6b;
            padding: 10px 16px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-box label:hover {
            background: #ff4757;
        }

        /* MENU */
        .menu {
            display: flex;
            gap: 14px;
        }

        .menu button {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.5);
            padding: 10px 18px;
            border-radius: 10px;
            color: white;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu button:hover {
            background: white;
            color: #764ba2;
            transform: translateY(-4px);
            /* transform: scale(110%); */
        }

        /* PROFILE */
        .profile {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="flex-container">

        <!-- SEARCH -->
        <div class="search-box">
            <input type="text" placeholder="Search here...">
            <label>Search</label>
        </div>

        <!-- MENU -->
        <div class="menu">
            <button>Home</button>
            <button>About</button>
            <button>Contact</button>
            <button>FAQ</button>
            <button>Scholarship</button>
        </div>

        <!-- PROFILE -->
        <div class="profile">
            A
        </div>

    </div>

</body>

</html>
