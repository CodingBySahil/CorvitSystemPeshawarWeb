<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Z-Index Example</title>

    <!--
    ============================
              Z-INDEX
    ============================

    - Controls which element appears on top
    - Works only when position ≠ static
    - Higher z-index = above others

    Real Life Example:
    - Layers in Photoshop
    - Cards overlapping on table
    -->

    <style>
        .box1 {
            width: 150px;
            height: 150px;
            background: blue;
            position: absolute;
            top: 50px;
            left: 50px;
            z-index: 1;
            /* behind */
        }

        .box2 {
            width: 150px;
            height: 150px;
            background: red;
            position: absolute;
            top: 80px;
            left: 80px;
            z-index: 3;
            /* on top */
        }

        .box3 {
            width: 150px;
            height: 150px;
            background: green;
            position: absolute;
            top: 110px;
            left: 110px;
            z-index: 2;
            /* middle */
        }
    </style>
</head>

<body>

    <h1>Z-Index Demonstration</h1>

    <div class="box1"></div>
    <div class="box3"></div>
    <div class="box2"></div>

</body>

</html>
