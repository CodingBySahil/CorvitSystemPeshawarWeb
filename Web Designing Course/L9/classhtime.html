<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class time HTML</title>
</head>

<body>
    <div style="position: relative;">
        <p
            style="background-color: red; padding: 40px; color:white; position: absolute; top:60px; z-index: 1; left:40px">
            low zindex</p>
        <p style="background-color: green; padding: 40px; color:white; position: absolute; z-index: 2;">high zindex</p>
        <p
            style="background-color: yellow; padding: 40px; color:white; position: absolute; z-index: 3; left:15px; top:15px">
            high zindex</p>
    </div>
</body>

</html>
