<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class time html</title>

    <style>
        /* Reusable Item Box */
        .item {
            background: royalblue;
            color: white;
            padding: 25px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
        }

        /* MAIN GRID LAYOUT */
        .gridcontainer {
            display: grid;
            gap: 6px;
            height: 800px;

            /* GRID LAYOUT TEMPLATE */
            grid-template-areas:
                "header header header header"
                "sidebar content content content"
                "footer footer footer footer";

            grid-template-rows: 90px 1fr 80px;
        }

        /* AREA DEFINITIONS */
        #header {
            grid-area: header;
        }

        #sidebar {
            grid-area: sidebar;
        }

        #content {
            grid-area: content;
        }

        #footer {
            grid-area: footer;
        }

        /* SIMPLE UI IMPROVEMENTS */
        button {
            color: white;
            background-color: rgb(197, 7, 255);
            font-weight: bold;
            padding: 6px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* Sidebar button style */
        p {
            background-color: #004aad;
            color: yellow;
            font-weight: bold;
            padding: 8px;
            margin-bottom: 6px;
            border-radius: 6px;
        }

        /* Content Cards */
        .card {
            width: 250px;
            height: 250px;
            background-color: crimson;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
        }
    </style>
</head>

<body>

    <!-- GRID CONTAINER -->
    <div class="gridcontainer">

        <!-- HEADER -->
        <div class="item" id="header" style="display: flex; justify-content: space-between; align-items: center;">

            <!-- Logo -->
            <button>MyLogo</button>

            <!-- Navigation -->
            <div style="display: flex; gap: 12px;">
                <button>About</button>
                <button>Home</button>
                <button>Contact</button>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="item" id="sidebar">
            <p>Dashboard</p>
            <p>Profile</p>
            <p>Messages</p>
            <p>Settings</p>
            <p>Help</p>
            <p>Logout</p>
        </div>

        <!-- CONTENT AREA -->
        <div class="item" id="content" style="display: flex; gap: 12px; flex-wrap: wrap; overflow-y: auto;">

            <div class="card">1</div>
            <div class="card">2</div>
            <div class="card">3</div>
            <div class="card">4</div>
            <div class="card">5</div>
            <div class="card">6</div>
            <div class="card">7</div>
            <div class="card">8</div>
            <div class="card">9</div>
            <div class="card">10</div>

        </div>

        <!-- FOOTER -->
        <div class="item" id="footer" style="background-color: #003b8e;">
            <p style="background:none; color:white; margin:0;">
                © 2025 Footer of website
            </p>
        </div>

    </div>

</body>

</html>
