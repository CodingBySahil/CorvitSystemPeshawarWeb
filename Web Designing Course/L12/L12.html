<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Class 12 – Transitions & Animations</title>

    <!--
    ============================================================
                CLASS 12: TRANSITIONS & ANIMATIONS
    ============================================================

    WHY WE USE TRANSITIONS & ANIMATIONS?
    ------------------------------------
    - To make websites feel modern, smooth, and interactive.
    - Helps attract user attention.
    - Makes buttons, cards, images feel “alive”.

    ============================================================
    ✦ PART 1: TRANSITIONS (Smooth Change)
    ============================================================

    CONCEPT:
    --------
    A transition allows an element to change from one style to another smoothly.

    Without transition:
        - Hover → instant change (sharp)

    With transition:
        - Hover → slow smooth change (professional effect)

    IMPORTANT PROPERTIES:
    ---------------------

    1) transition-property
       → Which CSS property will animate?
       Examples:
       - color
       - background-color
       - width
       - height
       - transform

    2) transition-duration
       → How long animation takes to complete?
       Examples:
       - 0.5s
       - 1s

    3) transition-timing-function (extra but important)
       → Speed curve of animation
       - ease (default)
       - linear
       - ease-in
       - ease-out
       - ease-in-out

    4) transition-delay (optional)
       → How long to wait before animation starts?

    ⭐ Shortcut:
       transition: property duration timing delay;

    EXAMPLE:
       transition: all 0.5s ease;

    ============================================================
    ✦ PART 2: KEYFRAMES (Animations)
    ============================================================

    CONCEPT:
    --------
    Keyframes = We define multiple steps of animation.

    Example:
      @keyframes moveBox {
          from { left: 0; }
          to   { left: 200px; }
      }

    Then we apply:
      animation-name: moveBox;
      animation-duration: 2s;
      animation-iteration-count: infinite;

    IMPORTANT ANIMATION PROPERTIES:
    -------------------------------
    1) animation-name
    2) animation-duration
    3) animation-timing-function
    4) animation-delay
    5) animation-iteration-count
       → 1, 2, infinite
    6) animation-direction
       → normal, reverse, alternate
    7) animation-fill-mode
       → forwards (keep final state)

    ============================================================
    ✦ PART 3: Hover Animations (Button Effects)
    ============================================================

    Hover effects are small animations that happen when mouse comes over.

    Examples:
    ✔ Grow
    ✔ Shrink
    ✔ Color change
    ✔ Shadow effect

    ============================================================
    ✦ PART 4: MINI PROJECT – Animated Button
    ============================================================
    A modern animated button using transitions + transform.
    ============================================================
    -->

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f4f4f4;
        }

        h1,
        h2 {
            margin-top: 40px;
        }

        /* ===========================================================
           PART 1: TRANSITION DEMO
        =========================================================== */

        .transition-box {
            width: 150px;
            height: 150px;
            background: lightcoral;
            border-radius: 10px;
            transition-property: background-color, transform;
            /* Animate bg color + transform */
            transition-duration: 0.5s;
            /* 0.5 sec smooth */
            transition-timing-function: ease;
            margin-bottom: 30px;
        }

        .transition-box:hover {
            background: royalblue;
            transform: scale(1.2);
        }

        /* ===========================================================
           PART 2: KEYFRAMES ANIMATION DEMO
        =========================================================== */

        /* Step-by-step animation */
        @keyframes movingBox {
            0% {
                left: 0;
                background: tomato;
            }

            50% {
                left: 150px;
                background: gold;
            }

            100% {
                left: 0;
                background: seagreen;
            }
        }

        @keyframes color-change-animation {
            0% {

                background: tomato;
            }

            50% {

                background: gold;
            }

            100% {

                background: seagreen;
            }
        }

        .animation-box {
            width: 120px;
            height: 120px;
            position: relative;
            border-radius: 10px;
            animation-name: movingBox;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            /* Move forward then backward */
            animation-timing-function: ease-in-out;
        }

        /* ===========================================================
           PART 3: HOVER ANIMATION BUTTONS
        =========================================================== */

        .hover-btn {
            background: royalblue;
            padding: 15px 30px;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.5s, transform 0.4s;
        }


        .newbox:hover {
            background-color: green;
        }

        .hover-btn:hover {
            background: darkblue;
            transform: translateY(-5px);
        }

        /* ===========================================================
           PART 4: MINI PROJECT – ANIMATED BUTTON
        =========================================================== */

        .project-btn {
            background: #ff5722;
            padding: 18px 35px;
            font-size: 20px;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.5s, letter-spacing 0.4s, transform 0.4s;
        }

        .project-btn:hover {
            background: #e64a19;
            letter-spacing: 2px;
            /* Text spreads */
            transform: scale(1.1);
            /* Grows */
        }
    </style>

</head>

<body>

    <h1>Class 12 – Transitions & Animations</h1>


    <!-- ============================================================
         PART 1: TRANSITION DEMO
         ============================================================ -->
    <h2 style="animation-name: color-change-animation; animation-duration: 5s; animation-iteration-count: infinite ;">1) Transitions Example</h2>

    <!--
        Hover to see smooth animation:
        - Box grows in size
        - Color changes
        - Animation comes from transition property
    -->
    <div class="transition-box"></div>


    <!-- ============================================================
         PART 2: KEYFRAME ANIMATION
         ============================================================ -->
    <h2 class="newbox">2) Keyframes Animation Example</h2>

    <!--
        This box:
        - Moves left to right
        - Changes color at different stages
        - Runs forever (infinite)
        - Uses @keyframes
    -->
    <div class="animation-box"></div>


    <!-- ============================================================
         PART 3: HOVER BUTTON EFFECTS
         ============================================================ -->
    <h2>3) Hover Button Animation</h2>

    <button class="hover-btn">Hover Me</button>


    <!-- ============================================================
         PART 4: MINI PROJECT – ANIMATED BUTTON
         ============================================================ -->
    <h2>4) Mini Project – Modern Animated Button</h2>

    <!--
        Project Features:
        - Button grows
        - Text spacing increases
        - Background darkens
        - Smooth professional animation
    -->
    <button class="project-btn">Click Me</button>

</body>

</html>
