<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>

    <form id="todoForm">
      <input type="text" id="inputText" placeholder="Enter a todo" />
      <button type="submit">Add</button>
    </form>

    <div class="actions">
      <button id="remAllBtn">Remove All</button>
      <button id="remSingleBtn">Remove Single</button>
    </div>

    <ul id="listParent">
        <!-- some random list -->
        <li>Learn HTML</li>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
        
        
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
