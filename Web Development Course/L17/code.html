<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- Arithmetic Operators -->
    <script>
        let num1 = 10;
        let num2 = 5;

        console.log("Addition:", num1 + num2);
        console.log("Subtraction:", num1 - num2);
        console.log("Multiplication:", num1 * num2);
        console.log("Division:", num1 / num2);
        console.log("Remainder:", num1 % num2);
    </script>



    <!-- Comparison Operators (Age Check) -->
    <script>
        let age = 18;

        console.log(age == 18);    // true
        console.log(age === "18"); // false (type check)
        console.log(age >= 18);    // true
        console.log(age < 18);     // false
    </script>


    <!-- Logical Operators (Login Validation) -->
    <script>
        let isLoggedIn = true;
        let hasPassword = true;

        if (isLoggedIn || hasPassword) {
            console.log("Login Successful");
        } else {
            console.log("Login Failed");
        }
    </script>


    <!-- if Statement (Pass / Fail) -->
    <script>
        let marks = 65;

        if (marks >= 50) {
            console.log("You are Pass");
        }
    </script>






    <!-- if-else Statement -->
    <script>
        let temperature = 35;

        if (temperature > 30) {
            console.log("Weather is Hot");
        } else {
            console.log("Weather is Normal");
        }
    </script>



    <!-- else if Statement (Grading System) -->
    <script>
        let score = 17;

        if (score >= 80) {
            console.log("Grade A");
        } else if (score >= 60) {
            console.log("Grade B");
        } else {
            console.log("Fail");
        }
    </script>


    <!--Calculator Using if else -->
    <script>
        let number1 = prompt("Enter value one ");
        let number2 =prompt("Enter value 2");
        // console.log(typeof number1);
        
        number1 = parseInt(number1);
        number2 = parseInt(number2);
        // console.log(typeof number1);
        let operator = prompt("Enter any operator");

        if (operator === "+") {
            console.log(number1 + number2);
        } else if (operator === "-") {
            console.log(number1 - number2);
        } else if (operator === "*") {
            console.log(number1 * number2);
        } else if (operator === "/") {
            console.log(number1 / number2);
        } else {
            console.log("Invalid Operator");
        }
    </script>

</body>

</html>
