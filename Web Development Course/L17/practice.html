      let num1 = parseInt(prompt("Enter first value"));
      let num2 = parseInt(prompt("Enter second value"));
      let op = prompt("Enter your operator");
      let total;
      if (op == "+") {
        total = num1 + num2;
        console.log("Addition is : " + total);
      } else if (op == "-") {
        total = num1 - num2;
        console.log("Subtraction is : " + total);
      } else if (op == "*") {
        total = num1 * num2;
        console.log("Multiplication is : " + total);
      } else if (op == "/") {
        total = num1 / num2;
        console.log("Division  is : " + total);
      } else if (op == "%") {
        total = num1 % num2;
        console.log("Modulus is : " + total);
      } else {
        console.log("Enter a valid operator (+ , - , * , /, %)");
      }
