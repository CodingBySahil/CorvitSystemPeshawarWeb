    <div id="parent"></div>

    <script>

        // document.querySelector("#para").style.color = 'red'
        let parent = document.getElementById("parent");
        function createPost(description, srcFromUser) {
            // let description = "this is a post"
            let pByJs = document.createElement('p');
            pByJs.textContent = description;
            let imgByJs = document.createElement('img');
            imgByJs.src = srcFromUser
            imgByJs.style.width = "80px"

            parent.appendChild(pByJs);
            document.getElementById('parent').appendChild(imgByJs)
        }

        createPost("this is post 1", "https://img.freepik.com/free-photo/waterfall-chae-son-national-park-lampang-thailand_554837-639.jpg?semt=ais_hybrid&w=740&q=80");

        createPost("this is post 3", 'https://greggvanourek.com/wp-content/uploads/2023/08/Nature-path-by-water-trees-and-mountains-AdobeStock_291242770-768x463.jpeg');

        parent.removeChild(parent.firstElementChild);
        parent.removeChild(parent.firstElementChild);

    </script>
