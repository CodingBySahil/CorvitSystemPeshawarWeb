<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Asynchronous JavaScript - Introduction</title>
</head>

<body>
    <h1>open the console for Output</h1>
    <script>
        /*
        ====================================================
        ASYNCHRONOUS JAVASCRIPT (INTRODUCTION)
        ====================================================
        
        JavaScript is SINGLE-THREADED
        It can do only ONE task at a time
        
        To handle slow tasks efficiently,
        JavaScript uses ASYNCHRONOUS programming
        
        ----------------------------------------------------
        SYNCHRONOUS
        ----------------------------------------------------
        Tasks run one by one
        Next task waits for previous task to finish
        If one task is slow, everything stops
        
        Real life:
        One person speaking, everyone else waits
        
        ----------------------------------------------------
        ASYNCHRONOUS
        ----------------------------------------------------
        Slow tasks run in background
        Program continues without waiting
        Result is handled later
        
        Real life:
        You order food and sit, waiter comes later
        
        ----------------------------------------------------
        WHY ASYNC IS IMPORTANT
        ----------------------------------------------------
        Web apps deal with:
        Network requests
        Timers
        User input
        APIs
        
        If JS waits for everything:
        Page freezes
        Bad user experience
        */


        /*
        ====================================================
        SYNCHRONOUS EXAMPLE
        ====================================================
        */

        console.log("Synchronous Start");

        console.log("Task 1: Open book");
        console.log("Task 2: Read chapter");
        console.log("Task 3: Close book");

        console.log("Synchronous End");

        /*
        Tasks run strictly in order
        Each line waits for previous one
        */


        /*
        ====================================================
        ASYNCHRONOUS EXAMPLE (setTimeout)
        ====================================================
        
        setTimeout:
        Runs code AFTER some time
        Does NOT block execution
        */

        console.log("Asynchronous Start");

        setTimeout(function () {
            console.log("This message runs after 3 seconds");
        }, 3000);

        console.log("This message runs immediately");

        console.log("Asynchronous End");

        /*
        Notice:
        setTimeout runs later
        Other code does not wait
        */


        /*
        ====================================================
        setInterval EXAMPLE (CLOCK)
        ====================================================
        
        setInterval:
        Repeats code again and again
        After fixed time interval
        
        Real life:
        Wall clock ticking every second
        */

        console.log("Clock Started");

        setInterval(function () {
            let time = new Date();
            console.log(
                "Time:",
                time.getHours() + ":" +
                time.getMinutes() + ":" +
                time.getSeconds()
            );
        }, 1000);



    </script>

    <script>
        /*
        ====================================================
        ASYNC / AWAIT — REAL API EXAMPLE (NO DOM)
        ====================================================
        
        WHY DO WE NEED ASYNC / AWAIT?
        
        Fetching data from a server takes TIME.
        JavaScript cannot stop the whole program and wait.
        
        If JavaScript waited:
        - Page would freeze
        - User experience would break
        
        So JavaScript uses ASYNCHRONOUS programming.
        
        ----------------------------------------------------
        IMPORTANT CONCEPT
        ----------------------------------------------------
        fetch() is ASYNCHRONOUS
        It returns a PROMISE (future value)
        
        async / await:
        - Makes async code look synchronous
        - But does NOT block the program
        - JavaScript pauses ONLY this function
        */


        async function fetchUsers() {
            console.log("1 Fetching users from server...");

            /*
            await tells JavaScript:
            "Wait here until the Promise is resolved"
        
            JavaScript waits ONLY inside this function
            Other code outside keeps running
            */

            const response = await fetch("https://jsonplaceholder.typicode.com/users");

            console.log("2 Server responded");

            /*
            response.json() ALSO returns a Promise
            So we use await again
            */

            const users = await response.json();

            console.log("3 Data converted to JavaScript object");

            /*
            Display fetched data
            */
            console.log("4 Users data received:");
            console.log(users);

            /*
            Accessing real data
            */
            console.log("5 First user name:", users[0].name);
            console.log("6 First user email:", users[0].email);
        }


        /*
        Calling async function
        */
        fetchUsers();


        /*
        This runs IMMEDIATELY
        It does NOT wait for fetchUsers
        */
        console.log(" Program continues while data is loading");


        /*
        ====================================================
        EXPECTED OUTPUT ORDER (IMPORTANT FOR STUDENTS)
        ====================================================
        
        1 Fetching users from server...
        2 Program continues while data is loading
        2 Server responded
        3 Data converted to JavaScript object
        4 Users data received:
        5 First user name: ...
        6 First user email: ...
        
        This proves:
        Async function pauses
        Program does NOT freeze
        */
    </script>


</body>

</html>
